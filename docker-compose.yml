services:
  localstack:
    # The LocalStack image needs LOCALSTACK_AUTH_TOKEN (free non-commercial plan). See .env.example.
    image: localstack/localstack:2026.10.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN in .env}
      - SERVICES=sqs,lambda,logs,cloudwatch,iam,sts
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      # Lambda functions run as sibling containers via the mounted Docker socket.
      - LAMBDA_DOCKER_NETWORK=burnswitch
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.localstack:/var/lib/localstack
    networks: [burnswitch]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  burnswitch:
    name: burnswitch
